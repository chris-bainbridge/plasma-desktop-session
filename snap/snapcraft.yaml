parts:
  scripts:
    plugin: dump
    source: ./scripts
  plasma-desktop-session:
    plugin: nil
    build-packages:
      - git
    override-build: |
      cd $CRAFT_PROJECT_DIR
      craftctl set version="$(date +%Y%m%d)+git$(git rev-parse --short HEAD)"
  sddm-runtime:
    plugin: nil
    after:
      - plasma-desktop-session
    stage-packages:
      - sddm
      - plasma-setup
      - plasma-keyboard
      - plasma-nm
    override-prime: |
      rm -rf "$CRAFT_PRIME/sddm"
      craftctl default
      # Neon's sddm deb ships only sddm-autologin and sddm-greeter pam
      # files; the main "sddm" pam service SDDM uses for password login
      # is missing. Install Ubuntu's vendored copy (snap/pam.d/sddm)
      # BEFORE the etc->sddm shuffle below moves it into place.
      install -D -m 0644 "$CRAFT_PROJECT_DIR/snap/pam.d/sddm" \
        "$CRAFT_PRIME/etc/pam.d/sddm"
      mkdir -p "$CRAFT_PRIME/sddm"
      for path in etc usr var; do
        if [ -e "$CRAFT_PRIME/$path" ]; then
          mv "$CRAFT_PRIME/$path" "$CRAFT_PRIME/sddm/$path"
        fi
      done
      # Neon's apt sddm/plasma-setup packages (+ plasma-setup's
      # plasma-nm/plasma-keyboard deps) pull in their own
      # libQt6*/libKF6*/plugins/qml via dependency resolution; strip
      # them and rely on the kf6-core26 content snap's Qt at runtime
      # instead (same Neon apt suite, so the ABI matches - no separate
      # rebuild needed). Both packages run unconfined on the host
      # rather than inside snap confinement (see
      # kde_sddm_integration/kde_plasma_setup_integration in
      # ubuntu-core-desktop/build.sh), hence staging them together here
      # instead of inside the confined plasma-desktop-session content.
      #
      # Kept, since they're first-party and not duplicated by the
      # content snaps: SDDM's own SddmComponents QML theme, and
      # plasma-setup's own QML modules/KPackages
      # (qt6/qml/org/kde/plasmasetup/*, the matching
      # usr/share/plasma/packages/org.kde.plasmasetup.* packages) plus
      # the qt6/plugins/kf6/packagestructure/plasmasetup.so structure
      # plugin it loads them through.
      qt_lib_dir="$CRAFT_PRIME/sddm/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      find "$qt_lib_dir" -maxdepth 1 \( -type f -o -type l \) \
        \( -name 'libQt6*.so*' -o -name 'libKF6*.so*' \) -delete
      find "$qt_lib_dir/qt6/plugins" -mindepth 1 -maxdepth 1 \
        ! -name kf6 -exec rm -rf {} + 2>/dev/null || true
      find "$qt_lib_dir/qt6/plugins/kf6" -mindepth 1 -maxdepth 1 \
        ! -name packagestructure -exec rm -rf {} + 2>/dev/null || true
      find "$qt_lib_dir/qt6/qml" -mindepth 1 -maxdepth 1 \
        ! -name SddmComponents ! -name org -exec rm -rf {} +
      if find "$CRAFT_PRIME/sddm/usr/lib" \
        \( -type f -o -type l \) -name 'libQt6*.so*' -print -quit | grep -q .; then
        echo "The SDDM/plasma-setup runtime must use Qt libraries from the KDE content snaps"
        exit 1
      fi
