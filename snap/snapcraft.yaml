name: plasma-desktop-session
adopt-info: plasma-desktop-session
base: core26
summary: Plasma Desktop Session for KDE Neon Core
description: |
  Strictly confined Plasma and Ubuntu desktop sessions for KDE Neon Core.

grade: stable
confinement: strict

environment:
  HOME: $SNAP_REAL_HOME
  XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
  XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
  XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share
  XDG_STATE_HOME: $SNAP_USER_COMMON/.local/state
  XDG_CONFIG_DIRS: :$SNAP/kf6/etc/xdg:$SNAP/plasma/etc/xdg:/etc/xdg
  XDG_DATA_DIRS: :$SNAP/kf6/usr/share:$SNAP/plasma/usr/share:/etc/xdg:/var/lib/snapd/desktop
  XDG_DESKTOP_PORTAL_DIR: /snap/plasma-core26-desktop/current/usr/share/xdg-desktop-portal
  PATH: $SNAP/plasma/usr/bin:$SNAP/kf6/usr/bin:$SNAP/kf6/usr/bin/qt6:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games
  LD_LIBRARY_PATH: $SNAP_LIBRARY_PATH:/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/usr/lib:/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/lib:$SNAP/plasma/usr/lib:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/sasl2:$SNAP/kf6/usr/lib:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
  QT_PLUGIN_PATH: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins
  QML2_IMPORT_PATH: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml
  # X11 keymap data lives in the kf6-core26 content snap (mounted at
  # $SNAP/kf6), NOT the plasma-core26 content snap ($SNAP/plasma).
  # XLOCALEDIR must therefore point under $SNAP/kf6: pointing it at
  # $SNAP/plasma/usr/share/X11/locale (which does not exist inside the
  # confined namespace) made libX11/libxkbcommon fail to load any
  # Compose/locale data ("No Compose file for locale C.UTF-8") and was
  # the trigger for the ksmserver SIGSEGV in libxkbcommon.
  XKB_CONFIG_ROOT: $SNAP/kf6/usr/share/X11/xkb
  XLOCALEDIR: $SNAP/kf6/usr/share/X11/locale
  XCURSOR_THEME: breeze_cursors
  XCURSOR_PATH: $SNAP/plasma/usr/share/icons:$SNAP/kf6/usr/share/icons

layout:
  /usr/share/X11/xorg.conf.d:
    symlink: $SNAP/plasma/usr/share/X11/xorg.conf.d
  /usr/share/X11/xkb:
    symlink: $SNAP/kf6/usr/share/X11/xkb
  /usr/share/libinput:
    symlink: $SNAP/plasma/usr/share/libinput
  /usr/share/pipewire:
    symlink: $SNAP/plasma/usr/share/pipewire
  /usr/share/glvnd/egl_vendor.d:
    symlink: $SNAP/plasma/usr/share/glvnd/egl_vendor.d
  /usr/bin/xkbcomp:
    symlink: $SNAP/kf6/usr/bin/xkbcomp
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3:
    symlink: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gbm:
    symlink: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gbm
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri:
    symlink: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/vdpau:
    symlink: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/vdpau

apps:
  plasma-desktop-session:
    command: run-session.sh
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - locale-control
      - systemd-user-control

  xdg-desktop-portal-kde:
    command: run-after-portal.sh org.kde.KWinWrapper $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/xdg-desktop-portal-kde
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-freedesktop-impl-portal-kde
    restart-delay: 1s

  plasma-kactivitymanagerd:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/kactivitymanagerd
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-activitymanager
    restart-delay: 1s

  plasma-ksplash:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/bin/ksplashqml
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    daemon: oneshot
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksplash
    restart-condition: never

  plasma-logoutprompt:
    command: run.sh $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/ksmserver-logout-greeter
    environment:
      QT_QPA_PLATFORM: wayland
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-logoutprompt
    restart-condition: never

  plasma-shutdown:
    command: run.sh $SNAP/plasma/usr/bin/plasma-shutdown
    environment:
      QT_QPA_PLATFORM: wayland
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - systemd-user-control
      - wayland-client
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-shutdown
    restart-condition: never

  plasma-kcminit:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/bin/kcminit_startup
    environment:
      QT_QPA_PLATFORM: wayland
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - systemd-user-control
      - wayland-client
      - x11
    after:
      - plasma-kwin-wayland
    daemon: forking
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-kcminit
    restart-condition: never

  plasma-ksmserver:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/bin/ksmserver
    environment:
      QT_QPA_PLATFORM: wayland
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - systemd-user-control
      - wayland-client
      - x11
    after:
      - plasma-kwin-wayland
      - plasma-kcminit
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksmserver
    restart-delay: 1s

  plasma-kwin-wayland:
    # KWin creates the session Wayland compositor. Don't let it inherit
    # client display variables from systemd --user, or it chooses a
    # nested Wayland/X11 backend instead of the DRM backend.
    command: run-kwin.sh $SNAP/plasma/usr/bin/kwin_wayland_wrapper --xwayland
    # kwin filters "restricted" Wayland globals (PlasmaWindowManagement,
    # PlasmaWindowActivationFeedback, fake input, screencast, etc.) per
    # client via FilteredDisplay::allowInterface(). To authorise a client
    # kwin looks up its .desktop file's X-KDE-Wayland-Interfaces field by
    # matching service->exec() to the client's executable path via
    # KApplicationTrader. Inside the snap that match can never succeed:
    # the desktop file's Exec=$SNAP/plasma/usr/bin/... contains the literal
    # (unexpanded) $SNAP, so QFileInfo(...).canonicalFilePath() never equals
    # the real /snap/plasma-desktop-session/<rev>/plasma/usr/bin/... path.
    # kwin therefore denies the global and plasmashell logs:
    #   "The PlasmaWindowManagement protocol hasn't activated in time"
    # and the desktop containment never renders. AppArmor profiles already
    # provide the confinement boundary here, so disable kwin's own
    # desktop-file-based interface permission checks.
    environment:
      KWIN_WAYLAND_NO_PERMISSION_CHECKS: "1"
    slots:
      - wayland
      - x11-server
      - desktop
      - screen-inhibit-control
    # kwin_wayland is the Wayland compositor and, on a physical/KMS
    # display, must acquire DRM master. Acquisition goes through
    # systemd-logind's seat/session device handshake: kwin_wayland calls
    # TakeDevice/TakeControl on the session's seat device to get the DRM
    # fd as master (and ReleaseDevice/ReleaseControl to hand it back).
    # Those org.freedesktop.login1.Session/Seat D-Bus methods are only
    # granted by login-session-control (login-session-observe allows only
    # read-only Properties). Without it AppArmor denies the calls and
    # kwin's DRM atomic commit fails EPERM ("Permission denied"), leaving
    # a black screen while systemd-logind retains DRM master.
    plugs:
      - systemd-user-control
      - wayland-client
      - opengl
      - login-session-observe
      - login-session-control
      - shutdown
      - system-observe
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-kwinwrapper
    restart-delay: 1s

  plasma-plasmashell:
    # Wait for the compositor itself (org.kde.KWin, claimed by
    # kwin_wayland once the Wayland server and its globals, including the
    # PlasmaWindowManagement protocol, are initialized) rather than the
    # wrapper (org.kde.KWinWrapper, claimed by kwin_wayland_wrapper before
    # kwin_wayland even starts). Waiting on the wrapper let plasmashell
    # connect to the compositor before the PlasmaWindowManagement protocol
    # was registered, producing "The PlasmaWindowManagement protocol
    # hasn't activated in time" and a broken window-management API.
    # org.kde.KWin is claimed during workspace creation, a few steps
    # before the compositor starts processing Wayland client connections
    # AND before it finishes DRM output enumeration. plasmashell's
    # ScreenPool queries the screen list once at startup and never
    # retries, so if it races ahead of kwin publishing its output the
    # whole desktop stays permanently black (see run-after.sh) -- poll
    # kwin's own readiness instead of guessing a fixed delay.
    command: run-after.sh org.kde.KWin $SNAP/plasma/usr/bin/plasmashell --no-respawn
    environment:
      PLASMA_WAITFORNAME_EXTRA_DELAY: "2"
      PLASMA_WAIT_FOR_KWIN_OUTPUT: "1"
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - mpris
      - wayland-client
      - login-session-observe
      - shutdown
      - system-observe
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-plasmashell
    restart-delay: 1s

  plasma-krunner:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/bin/krunner --daemon
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - mpris
      - wayland-client
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-krunner

  plasma-kded6:
    command: run-after.sh org.kde.KWinWrapper $SNAP/kf6/usr/bin/kded6
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
      - shutdown
      - system-observe
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-kded6
    restart-delay: 1s

  plasma-ksystemstats:
    command: run.sh $SNAP/plasma/usr/bin/ksystemstats
    slots:
      - wayland
      - x11-server
      - desktop
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksystemstats1
    restart-delay: 1s

  plasma-xembedsniproxy:
    command: run-after.sh org.kde.plasmashell $SNAP/plasma/usr/bin/xembedsniproxy
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
      - x11
    after:
      - plasma-kwin-wayland
    daemon: simple
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-xembedsniproxy
    restart-delay: 1s

  plasma-gmenudbusmenuproxy:
    command: run-after.sh org.kde.plasmashell $SNAP/plasma/usr/bin/gmenudbusmenuproxy
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
      - x11
    after:
      - plasma-kwin-wayland
    daemon: simple
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-gmenudbusmenuproxy
    restart-delay: 1s

  plasma-powerdevil:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/org_kde_powerdevil
    slots:
      - wayland
      - x11-server
      - desktop
      - screen-inhibit-control
    plugs:
      - wayland-client
      - login-session-observe
      - shutdown
      - system-observe
      - upower-observe
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-solid-powermanagement
    restart-delay: 1s

  plasma-polkit-agent:
    # Ordering matters: this daemon:simple agent has no D-Bus name to wait
    # on (run-after.sh waits for org.kde.ksmserver, which is claimed before
    # kwin's wrapper exports WAYLAND_DISPLAY/XAUTHORITY). If it starts before
    # kwin_wayland, Qt finds no WAYLAND_DISPLAY, falls back to the xcb platform
    # plugin via DISPLAY=:0, fails xcb auth, and the agent crashes/restart-loops:
    #   "Could not load the Qt platform plugin \"xcb\" ... no Qt platform plugin
    #   could be initialized". Ordering it after kwin (like plasmashell) ensures
    # the Wayland socket and Xauthority file are exported before it starts.
    command: run-after.sh org.kde.KWin $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/polkit-kde-authentication-agent-1
    environment:
      PLASMA_WAITFORNAME_EXTRA_DELAY: "2"
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - polkit-agent
      - wayland-client
    after:
      - plasma-kwin-wayland
    daemon: simple
    passthrough:
      daemon-scope: user
    restart-delay: 1s

  kaccess:
    command: run.sh $SNAP/plasma/usr/bin/kaccess
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    autostart: kaccess.desktop

  xwaylandvideobridge:
    command: run.sh $SNAP/plasma/usr/bin/xwaylandvideobridge
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    autostart: org.kde.xwaylandvideobridge.desktop


plugs:
  kf6-core26:
    content: kf6-core26
    interface: content
    target: $SNAP/kf6
  plasma-core26:
    content: plasma-core26
    interface: content
    target: $SNAP/plasma
  wayland-client:
    interface: wayland

  audio-playback: null
  audio-record: null
  avahi-control: null
  bluez: null
  bluetooth-control: null
  cups-control: null
  desktop-launch: null
  dot-hidden:
    interface: personal-files
    write:
      - $HOME/.hidden
  hardware-observe: null
  hostname-control: null
  home: null
  login-session-observe: null
  login-session-control: null
  mount-observe: null
  network-bind: null
  network-control: null
  network-observe: null
  network-manager: null
  opengl: null
  pulseaudio: null
  pipewire: null
  process-control: null
  shutdown: null
  ssh-keys: null
  system-observe: null
  shell-session-locale-files:
    interface: personal-files
    write:
      - $HOME/.pam_environment
      - $HOME/.xinputrc
      - $HOME/.gtkrc-2.0
  shell-config-files:
    interface: system-files
    read:
      - /etc/alsa
      - /etc/fonts
      - /etc/glvnd
      - /etc/gtk-3.0
      - /etc/pulse
      - /etc/shells
      - /etc/xdg/autostart
      - /etc/xdg/menus
      - /etc/xdg/plasma-workspace
      - /etc/xdg
      - /run/udev/tags/seat
      - /etc/default/im-config
      - /etc/writable/default/im-config
      - /etc/X11/xinit/xinputrc
      - /etc/default/locale
      - /etc/shadow
      - /etc/pam.d
      - /etc/security
      - /etc/login.defs
      - /var/lib/extrausers
  upower-observe: null

slots:
  x11-server:
    interface: x11
  dbus-kde-drkonqi:
    interface: dbus
    bus: session
    name: org.kde.drkonqi
  dbus-kde-startup:
    interface: dbus
    bus: session
    name: org.kde.Startup
  dbus-kde-shutdown:
    interface: dbus
    bus: session
    name: org.kde.Shutdown
  dbus-kde-ksplash:
    interface: dbus
    bus: session
    name: org.kde.KSplash
  dbus-kde-kwinwrapper:
    interface: dbus
    bus: session
    name: org.kde.KWinWrapper
  dbus-kde-kwin:
    interface: dbus
    bus: session
    name: org.kde.KWin
  dbus-kde-ksmserver:
    interface: dbus
    bus: session
    name: org.kde.ksmserver
  dbus-kde-logoutprompt:
    interface: dbus
    bus: session
    name: org.kde.LogoutPrompt
  dbus-kde-kded6:
    interface: dbus
    bus: session
    name: org.kde.kded6
  dbus-kde-kglobalaccel:
    interface: dbus
    bus: session
    name: org.kde.kglobalaccel
  dbus-kde-kglobalaccel2:
    interface: dbus
    bus: session
    name: org.kde.KGlobalAccel
  dbug-kde-gtkconfig:
    interface: dbus
    bus: session
    name: org.kde.GtkConfig
  dbus-kde-screensaver:
    interface: dbus
    bus: session
    name: org.kde.screensaver
  dbus-kde-screenbrightness:
