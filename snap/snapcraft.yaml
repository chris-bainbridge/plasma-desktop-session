    name: org.kde.krunner
  dbus-kde-runner-activities:
    interface: dbus
    bus: session
    name: org.kde.runners.activities
  dbus-kde-plasmashell:
    interface: dbus
    bus: session
    name: org.kde.plasmashell
  dbus-kde-plasmashell-accentcolor:
    interface: dbus
