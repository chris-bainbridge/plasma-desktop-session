name: plasma-desktop-session
adopt-info: plasma-desktop-session
build-base: core20
passthrough:
  base: plasma-core22-desktop
summary: Plasma Desktop Session for KDE Neon Core
description: |
  Strictly confined Plasma and Ubuntu desktop sessions for KDE Neon Core.

grade: stable
confinement: strict
architectures:
  - build-on: amd64
    run-on: all

environment:
  HOME: $SNAP_REAL_HOME
  XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
  XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
  XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share
  XDG_STATE_HOME: $SNAP_USER_COMMON/.local/state

apps:
  plasma-desktop-session:
    command: run-session.sh
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - snapd-control

  xdg-desktop-portal-kde:
    command: run-portal.sh /usr/lib/x86_64-linux-gnu/libexec/xdg-desktop-portal-kde
    slots:
      - wayland
      - x11
      - desktop
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-freedesktop-impl-portal-kde
    restart-delay: 1s

  pipewire:
    command: run.sh /usr/bin/pipewire
    daemon: simple
    sockets:
      pipewire:
        listen-stream: $XDG_RUNTIME_DIR/pipewire-0
    passthrough:
      daemon-scope: user
    plugs:
      - alsa
    before:
      - wireplumber

  pipewire-pulse:
    command: run.sh /usr/bin/pipewire-pulse
    daemon: simple
    sockets:
      pulse:
        listen-stream: $XDG_RUNTIME_DIR/pulse/native
    passthrough:
      daemon-scope: user
    plugs:
      - alsa

  wireplumber:
    command: run.sh /usr/bin/wireplumber
    daemon: simple
    passthrough:
      daemon-scope: user
    after:
      - pipewire
    plugs:
      - alsa

plugs:
  avahi-control: null
  bluez: null
  bluetooth-control: null
  cups-control: null
  desktop-launch: null
  dot-hidden:
    interface: personal-files
    write:
      - $HOME/.hidden
  hardware-observe: null
  hostname-control: null
  home: null
  login-session-observe: null
  login-session-control: null
  mount-observe: null
  network-bind: null
  network-control: null
  network-observe: null
  network-manager: null
  opengl: null
  polkit-agent: null
  process-control: null
  shutdown: null
  ssh-keys: null
  system-observe: null
  shell-session-locale-files:
    interface: personal-files
    write:
      - $HOME/.pam_environment
      - $HOME/.xinputrc
  shell-config-files:
    interface: system-files
    read:
      - /etc/alsa
      - /etc/fonts
      - /etc/glvnd
      - /etc/gtk-3.0
      - /etc/pulse
      - /etc/shells
      - /etc/xdg/autostart
      - /etc/xdg/menus
      - /etc/xdg/plasma-workspace
      - /run/udev/tags/seat
      - /etc/default/im-config
      - /etc/X11/xinit/xinputrc
      - /etc/default/locale
  upower-observe: null

slots:
  audio-playback: null
  audio-record: null
  pulseaudio: null
  desktop: null
  dbus-kde-startup:
    interface: dbus
    bus: session
    name: org.kde.Startup
  dbus-kde-ksplash:
    interface: dbus
    bus: session
    name: org.kde.KSplash
  dbus-kde-kwinwrapper:
    interface: dbus
    bus: session
    name: org.kde.KWinWrapper
  dbus-kde-kwin:
    interface: dbus
    bus: session
    name: org.kde.KWin
  dbus-kde-ksmserver:
    interface: dbus
    bus: session
    name: org.kde.ksmserver
  dbus-kde-kded6:
    interface: dbus
    bus: session
    name: org.kde.kded6
  dbus-kde-kglobalaccel:
    interface: dbus
    bus: session
    name: org.kde.kglobalaccel
  dbus-kde-kglobalaccel2:
    interface: dbus
    bus: session
    name: org.kde.KGlobalAccel
  dbug-kde-gtkconfig:
    interface: dbus
    bus: session
    name: org.kde.GtkConfig
  dbus-kde-screensaver:
    interface: dbus
    bus: session
    name: org.kde.screensaver
  dbus-kde-keyboard:
    interface: dbus
    bus: session
    name: org.kde.keyboard
  dbus-kde-kcminit:
    interface: dbus
    bus: session
    name: org.kde.kcminit
  dbus-kde-kaccess:
    interface: dbus
    bus: session
    name: org.kde.kaccess
  dbus-kde-kappmenu:
    interface: dbus
    bus: session
    name: org.kde.kappmenu
  dbus-kde-baloo:
    interface: dbus
    bus: session
    name: org.kde.baloo
  dbus-kde-solid:
    interface: dbus
    bus: session
    name: org.kde.Solid
  dbus-kde-powerdevil:
    interface: dbus
    bus: session
    name: org.kde.powerdevil
  dbus-kde-powerdevil2:
    interface: dbus
    bus: session
    name: local.org_kde_powerdevil
  dbus-kde-krunner:
    interface: dbus
    bus: session
    name: org.kde.krunner
  dbus-kde-plasmashell:
    interface: dbus
    bus: session
    name: org.kde.plasmashell
  dbus-kde-plasmanetworkmanagement:
    interface: dbus
    bus: session
    name: org.kde.plasmanetworkmanagement
  dbus-kde-discover-notifier:
    interface: dbus
    bus: session
    name: org.kde.discover.notifier
  dbus-kde-polkit-agent:
    interface: dbus
    bus: session
    name: org.kde.polkit-kde-authentication-agent
  dbus-kde-kf6auth:
    interface: dbus
    bus: session
    name: org.kde.kf6auth
  dbus-kde-activitymanager:
    interface: dbus
    bus: session
    name: org.kde.ActivityManager
  dbus-kde-plasma-welcome:
    interface: dbus
    bus: session
    name: org.kde.plasma-welcome
  dbus-freedesktop-impl-portal-kde:
    interface: dbus
    bus: session
    name: org.freedesktop.impl.portal.desktop.kde
  dbus-freedesktop-powermanagement:
    interface: dbus
    bus: session
    name: org.freedesktop.PowerManagement
  dbus-freedesktop-screensaver:
    interface: dbus
    bus: session
    name: org.freedesktop.ScreenSaver
  dbus-freedesktop-secrets:
    interface: dbus
    bus: session
    name: org.freedesktop.secrets
  dbus-kde-statusnotifier:
    interface: dbus
    bus: session
    name: org.kde.StatusNotifierWatcher
  dbus-pulseaudio-server:
    interface: dbus
    bus: session
    name: org.pulseaudio.Server
  dbus-portal:
    interface: dbus
    name: org.freedesktop.impl.portal.PermissionStore
    bus: session
  dbus-wireplumber:
    interface: dbus
    name: org.freedesktop.ReserveDevice1
    bus: session

parts:
  scripts:
    plugin: dump
    source: ./scripts
  plasma-desktop-session:
    plugin: nil
    build-packages:
      - git
    override-build: |
      cd $SNAPCRAFT_PROJECT_DIR
      snapcraftctl set-version $(date +%Y%m%d)+git$(git rev-parse --short HEAD)
