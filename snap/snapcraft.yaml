name: plasma-desktop-session
adopt-info: plasma-desktop-session
build-base: core20
passthrough:
  base: plasma-core22-desktop
summary: Plasma Desktop Session for KDE Neon Core
description: |
  Strictly confined Plasma and Ubuntu desktop sessions for KDE Neon Core.

grade: stable
confinement: strict
architectures:
  - build-on: amd64
    run-on: all

environment:
  HOME: $SNAP_REAL_HOME
  XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
  XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
  XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share
  XDG_STATE_HOME: $SNAP_USER_COMMON/.local/state

apps:
  plasma-desktop-session:
    command: run-session.sh
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - udisks2
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - mpris
      - dbus-powerprofiles

  xdg-desktop-portal-kde:
    command: run-portal.sh /usr/lib/x86_64-linux-gnu/libexec/xdg-desktop-portal-kde
    slots:
      - wayland
      - x11
      - desktop
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-freedesktop-impl-portal-kde
    restart-delay: 1s

  plasma-kactivitymanagerd:
    command: run.sh /usr/lib/x86_64-linux-gnu/libexec/kactivitymanagerd
    slots:
      - wayland
      - x11
      - desktop
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-activitymanager
    restart-delay: 1s

  plasma-ksplash:
    command: run-after.sh org.kde.KWinWrapper /usr/bin/ksplashqml
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - udisks2
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - mpris
    daemon: oneshot
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksplash
    restart-condition: never

  plasma-logoutprompt:
    command: run.sh /usr/lib/x86_64-linux-gnu/libexec/ksmserver-logout-greeter
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - udisks2
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - mpris
      - shutdown
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-logoutprompt
    restart-condition: never

  plasma-shutdown:
    command: run.sh /usr/bin/plasma-shutdown
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - udisks2
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - shutdown
      - mpris
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-shutdown
    restart-condition: never

  plasma-kcminit:
    command: run-after.sh org.kde.KWinWrapper /usr/bin/kcminit_startup
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - udisks2
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - mpris
    daemon: forking
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-kcminit
    restart-condition: never

  plasma-ksmserver:
    command: run-after.sh org.kde.kcminit /usr/bin/ksmserver
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - udisks2
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - mpris
    after:
      - plasma-kwin-wayland
      - plasma-kcminit
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksmserver
    restart-delay: 1s

  plasma-kwin-wayland:
    command: run-portal.sh /usr/bin/kwin_wayland_wrapper --xwayland
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - udisks2
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - shutdown
      - mpris
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-kwinwrapper
    restart-delay: 1s

  plasma-plasmashell:
    command: run.sh /usr/bin/plasmashell --no-respawn
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - udisks2
      - shell-session-locale-files
      - desktop-launch
      - shutdown
      - systemd-user-control
      - mpris
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-plasmashell
    restart-delay: 1s

  plasma-krunner:
    command: run.sh /usr/bin/krunner --daemon
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - udisks2
      - shell-session-locale-files
      - desktop-launch
      - shutdown
      - systemd-user-control
      - mpris
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-krunner


  plasma-kded6:
    command: run.sh /usr/bin/kded6
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - udisks2
      - shell-session-locale-files
      - desktop-launch
      - shutdown
      - systemd-user-control
      - mpris
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-kded6
    restart-delay: 1s

  plasma-ksystemstats:
    command: run.sh /usr/bin/ksystemstats
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - udisks2
      - shell-session-locale-files
      - desktop-launch
      - shutdown
      - systemd-user-control
      - mpris
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksystemstats1
    restart-delay: 1s

  plasma-xembedsniproxy:
    command: run-after.sh org.kde.plasmashell /usr/bin/xembedsniproxy
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - mpris
    daemon: simple
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-xembedsniproxy
    restart-delay: 1s

  plasma-gmenudbusmenuproxy:
    command: run-after.sh org.kde.plasmashell /usr/bin/gmenudbusmenuproxy
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - mpris
    daemon: simple
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-gmenudbusmenuproxy
    restart-delay: 1s

  plasma-powerdevil:
    command: run.sh /usr/lib/x86_64-linux-gnu/libexec/org_kde_powerdevil
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - shell-session-locale-files
      - desktop-launch
      - shutdown
      - systemd-user-control
      - mpris
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-solid-powermanagement
    restart-delay: 1s

  kaccess:
    command: run.sh /usr/bin/kaccess
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - mpris
    autostart: kaccess.desktop

  xwaylandvideobridge:
    command: run.sh /usr/bin/xwaylandvideobridge
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - account-control
      - locale-control
      - time-control
      - timeserver-control
      - timezone-control
      - network-manager
      - shell-session-locale-files
      - desktop-launch
      - systemd-user-control
      - mpris
    autostart: org.kde.xwaylandvideobridge.desktop

  pipewire:
    command: run.sh /usr/bin/pipewire
    daemon: simple
    sockets:
      pipewire:
        listen-stream: $XDG_RUNTIME_DIR/pipewire-0
    passthrough:
      daemon-scope: user
    plugs:
      - alsa
    before:
      - wireplumber

  pipewire-pulse:
    command: run.sh /usr/bin/pipewire-pulse
    daemon: simple
    sockets:
      pulse:
        listen-stream: $XDG_RUNTIME_DIR/pulse/native
    passthrough:
      daemon-scope: user
    plugs:
      - alsa

  wireplumber:
    command: run.sh /usr/bin/wireplumber
    daemon: simple
    passthrough:
      daemon-scope: user
    after:
      - pipewire
    plugs:
      - alsa

plugs:
  avahi-control: null
  bluez: null
  bluetooth-control: null
  cups-control: null
  desktop-launch: null
  dot-hidden:
    interface: personal-files
    write:
      - $HOME/.hidden
  hardware-observe: null
  hostname-control: null
  home: null
  login-session-observe: null
  login-session-control: null
  mount-observe: null
  mpris: null
  network-bind: null
  network-control: null
  network-observe: null
  network-manager: null
  opengl: null
  polkit-agent: null
  process-control: null
  shutdown: null
  ssh-keys: null
  system-observe: null
  shell-session-locale-files:
    interface: personal-files
    write:
      - $HOME/.pam_environment
      - $HOME/.xinputrc
      - $HOME/.gtkrc-2.0
  shell-config-files:
    interface: system-files
    read:
      - /etc/alsa
      - /etc/fonts
      - /etc/glvnd
      - /etc/gtk-3.0
      - /etc/pulse
      - /etc/shells
      - /etc/xdg/autostart
      - /etc/xdg/menus
      - /etc/xdg/plasma-workspace
      - /etc/xdg
      - /run/udev/tags/seat
      - /etc/default/im-config
      - /etc/writable/default/im-config
      - /etc/X11/xinit/xinputrc
      - /etc/default/locale
  udisks2: null
  upower-observe: null
  dbus-powerprofiles:
    interface: dbus
    name: net.hadess.PowerProfiles
    bus: system

slots:
  audio-playback: null
  audio-record: null
  pulseaudio: null
  desktop: null
  dbus-kde-drkonqi:
    interface: dbus
    bus: session
    name: org.kde.drkonqi
  dbus-kde-startup:
    interface: dbus
    bus: session
    name: org.kde.Startup
  dbus-kde-shutdown:
    interface: dbus
    bus: session
    name: org.kde.Shutdown
  dbus-kde-ksplash:
    interface: dbus
    bus: session
    name: org.kde.KSplash
  dbus-kde-kwinwrapper:
    interface: dbus
    bus: session
    name: org.kde.KWinWrapper
  dbus-kde-kwin:
    interface: dbus
    bus: session
    name: org.kde.KWin
  dbus-kde-ksmserver:
    interface: dbus
    bus: session
    name: org.kde.ksmserver
  dbus-kde-logoutprompt:
    interface: dbus
    bus: session
    name: org.kde.LogoutPrompt
  dbus-kde-kded6:
    interface: dbus
    bus: session
    name: org.kde.kded6
  dbus-kde-kglobalaccel:
    interface: dbus
    bus: session
    name: org.kde.kglobalaccel
  dbus-kde-kglobalaccel2:
    interface: dbus
    bus: session
    name: org.kde.KGlobalAccel
  dbug-kde-gtkconfig:
    interface: dbus
    bus: session
    name: org.kde.GtkConfig
  dbus-kde-screensaver:
    interface: dbus
    bus: session
    name: org.kde.screensaver
  dbus-kde-keyboard:
    interface: dbus
    bus: session
    name: org.kde.keyboard
  dbus-kde-kcminit:
    interface: dbus
    bus: session
    name: org.kde.kcminit
  dbus-kde-kaccess:
    interface: dbus
    bus: session
    name: org.kde.kaccess
  dbus-kde-kappmenu:
    interface: dbus
    bus: session
