name: plasma-desktop-session
adopt-info: plasma-desktop-session
base: core24
summary: Plasma Desktop Session for KDE Neon Core
description: |
  Strictly confined Plasma and Ubuntu desktop sessions for KDE Neon Core.

grade: stable
confinement: strict

environment:
  HOME: $SNAP_REAL_HOME
  XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
  XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
  XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share
  XDG_STATE_HOME: $SNAP_USER_COMMON/.local/state
  XDG_CONFIG_DIRS: :$SNAP/kf6/etc/xdg:$SNAP/plasma/etc/xdg:/etc/xdg
  XDG_DATA_DIRS: :$SNAP/kf6/usr/share:$SNAP/plasma/usr/share:/etc/xdg:/var/lib/snapd/desktop
  XDG_DESKTOP_PORTAL_DIR: /snap/plasma-core24-desktop/current/usr/share/xdg-desktop-portal
  PATH: $SNAP/kf6/usr/bin:$SNAP/kf6/usr/bin/qt6:$SNAP/plasma/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games
  LD_LIBRARY_PATH: $SNAP_LIBRARY_PATH:$SNAP/kf6/usr/lib:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/plasma/usr/lib:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/sasl2
  QT_PLUGIN_PATH: $SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins
  QML2_IMPORT_PATH: $SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml

layout:
  /etc/alsa:
    bind: $SNAP/plasma/etc/alsa
  /etc/pulse:
    bind: $SNAP/plasma/etc/pulse
  /usr/share/alsa:
    symlink: $SNAP/plasma/usr/share/alsa
  /usr/share/alsa-card-profile:
    symlink: $SNAP/plasma/usr/share/alsa-card-profile
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri:
    symlink: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri
  /usr/share/libinput:
    symlink: $SNAP/plasma/usr/share/libinput
  /usr/share/X11/xkb:
    symlink: $SNAP/kf6/usr/share/X11/xkb
  /usr/share/X11/locale:
    symlink: $SNAP/plasma/usr/share/X11/locale
  /usr/share/X11/xorg.conf.d:
    symlink: $SNAP/plasma/usr/share/X11/xorg.conf.d
  /usr/share/X11/XErrorDB:
    symlink: $SNAP/plasma/usr/share/X11/XErrorDB
  /usr/share/pipewire:
    symlink: $SNAP/plasma/usr/share/pipewire
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3:
    symlink: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/spa-0.2:
    symlink: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/spa-0.2
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/vdpau:
    symlink: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/vdpau
  /usr/share/drirc.d:
    symlink: $SNAP/plasma/usr/share/drirc.d
  /usr/share/glvnd:
    symlink: $SNAP/plasma/usr/share/glvnd
  /etc/vulkan:
    bind: $SNAP/plasma/etc/vulkan
  /usr/bin/xkbcomp:
    symlink: $SNAP/plasma/usr/bin/xkbcomp

apps:
  plasma-desktop-session:
    command: run-session.sh
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - locale-control
      - systemd-user-control

  xdg-desktop-portal-kde:
    command: run-portal.sh $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/xdg-desktop-portal-kde
    slots:
      - wayland
      - x11
      - desktop
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-freedesktop-impl-portal-kde
    restart-delay: 1s

  plasma-kactivitymanagerd:
    command: run.sh $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/kactivitymanagerd
    slots:
      - wayland
      - x11
      - desktop
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-activitymanager
    restart-delay: 1s

  plasma-ksplash:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/bin/ksplashqml
    slots:
      - wayland
      - x11
      - desktop
    daemon: oneshot
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksplash
    restart-condition: never

  plasma-logoutprompt:
    command: run.sh $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/ksmserver-logout-greeter
    slots:
      - wayland
      - x11
      - desktop
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-logoutprompt
    restart-condition: never

  plasma-shutdown:
    command: run.sh $SNAP/plasma/usr/bin/plasma-shutdown
    slots:
      - wayland
      - x11
      - desktop
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-shutdown
    restart-condition: never

  plasma-kcminit:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/bin/kcminit_startup
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - systemd-user-control
    daemon: forking
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-kcminit
    restart-condition: never

  plasma-ksmserver:
    command: run-after.sh org.kde.kcminit $SNAP/plasma/usr/bin/ksmserver
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - systemd-user-control
    after:
      - plasma-kwin-wayland
      - plasma-kcminit
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksmserver
    restart-delay: 1s

  plasma-kwin-wayland:
    command: run-portal.sh $SNAP/plasma/usr/bin/kwin_wayland_wrapper --xwayland
    slots:
      - wayland
      - x11
      - desktop
      - screen-inhibit-control
    plugs:
      - systemd-user-control
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-kwinwrapper
    restart-delay: 1s

  plasma-plasmashell:
    command: run.sh $SNAP/plasma/usr/bin/plasmashell --no-respawn
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - mpris
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-plasmashell
    restart-delay: 1s

  plasma-krunner:
    command: run.sh $SNAP/plasma/usr/bin/krunner --daemon
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - mpris
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-krunner

  plasma-kded6:
    command: run.sh $SNAP/kf6/usr/bin/kded6
    slots:
      - wayland
      - x11
      - desktop
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-kded6
    restart-delay: 1s

  plasma-ksystemstats:
    command: run.sh $SNAP/plasma/usr/bin/ksystemstats
    slots:
      - wayland
      - x11
      - desktop
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksystemstats1
    restart-delay: 1s

  plasma-xembedsniproxy:
    command: run-after.sh org.kde.plasmashell $SNAP/plasma/usr/bin/xembedsniproxy
    slots:
      - wayland
      - x11
      - desktop
    daemon: simple
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-xembedsniproxy
    restart-delay: 1s

  plasma-gmenudbusmenuproxy:
    command: run-after.sh org.kde.plasmashell $SNAP/plasma/usr/bin/gmenudbusmenuproxy
    slots:
      - wayland
      - x11
      - desktop
    daemon: simple
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-gmenudbusmenuproxy
    restart-delay: 1s

  plasma-powerdevil:
    command: run.sh $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/org_kde_powerdevil
    slots:
      - wayland
      - x11
      - desktop
      - screen-inhibit-control
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-solid-powermanagement
    restart-delay: 1s

  plasma-polkit-agent:
    command: run-after.sh org.kde.ksmserver $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/polkit-kde-authentication-agent-1
    slots:
      - wayland
      - x11
      - desktop
    plugs:
      - polkit-agent
    daemon: simple
    passthrough:
      daemon-scope: user
    restart-delay: 1s

  kaccess:
    command: run.sh $SNAP/plasma/usr/bin/kaccess
    slots:
      - wayland
      - x11
      - desktop
    autostart: kaccess.desktop

  xwaylandvideobridge:
    command: run.sh $SNAP/plasma/usr/bin/xwaylandvideobridge
    slots:
      - wayland
      - x11
      - desktop
    autostart: org.kde.xwaylandvideobridge.desktop


plugs:
  kf6-core24:
    content: kf6-core24
    interface: content
    target: $SNAP/kf6
  plasma-core24:
    content: plasma-core24
    interface: content
    target: $SNAP/plasma

  audio-playback: null
  audio-record: null
  avahi-control: null
  bluez: null
  bluetooth-control: null
  cups-control: null
  desktop-launch: null
  dot-hidden:
    interface: personal-files
    write:
      - $HOME/.hidden
  hardware-observe: null
  hostname-control: null
  home: null
  login-session-observe: null
  login-session-control: null
  mount-observe: null
  network-bind: null
  network-control: null
  network-observe: null
  network-manager: null
  opengl: null
  pulseaudio: null
  pipewire: null
  process-control: null
  shutdown: null
  ssh-keys: null
  system-observe: null
  shell-session-locale-files:
    interface: personal-files
    write:
      - $HOME/.pam_environment
      - $HOME/.xinputrc
      - $HOME/.gtkrc-2.0
  shell-config-files:
    interface: system-files
    read:
      - /etc/alsa
      - /etc/fonts
      - /etc/glvnd
      - /etc/gtk-3.0
      - /etc/pulse
      - /etc/shells
      - /etc/xdg/autostart
      - /etc/xdg/menus
      - /etc/xdg/plasma-workspace
      - /etc/xdg
      - /run/udev/tags/seat
      - /etc/default/im-config
      - /etc/writable/default/im-config
      - /etc/X11/xinit/xinputrc
      - /etc/default/locale
      - /etc/shadow
      - /etc/pam.d
      - /etc/security
      - /etc/login.defs
      - /var/lib/extrausers
  udisks2: null
  upower-observe: null

slots:
  dbus-kde-drkonqi:
    interface: dbus
    bus: session
    name: org.kde.drkonqi
  dbus-kde-startup:
    interface: dbus
    bus: session
    name: org.kde.Startup
  dbus-kde-shutdown:
    interface: dbus
    bus: session
    name: org.kde.Shutdown
  dbus-kde-ksplash:
    interface: dbus
    bus: session
    name: org.kde.KSplash
  dbus-kde-kwinwrapper:
    interface: dbus
    bus: session
    name: org.kde.KWinWrapper
  dbus-kde-kwin:
    interface: dbus
    bus: session
    name: org.kde.KWin
  dbus-kde-ksmserver:
    interface: dbus
    bus: session
    name: org.kde.ksmserver
  dbus-kde-logoutprompt:
    interface: dbus
    bus: session
    name: org.kde.LogoutPrompt
  dbus-kde-kded6:
    interface: dbus
    bus: session
    name: org.kde.kded6
  dbus-kde-kglobalaccel:
    interface: dbus
    bus: session
    name: org.kde.kglobalaccel
  dbus-kde-kglobalaccel2:
    interface: dbus
    bus: session
    name: org.kde.KGlobalAccel
  dbug-kde-gtkconfig:
    interface: dbus
    bus: session
    name: org.kde.GtkConfig
  dbus-kde-screensaver:
    interface: dbus
    bus: session
    name: org.kde.screensaver
  dbus-kde-screenbrightness:
    interface: dbus
    bus: session
    name: org.kde.ScreenBrightness
  dbus-kde-keyboard:
    interface: dbus
    bus: session
    name: org.kde.keyboard
  dbus-kde-kcminit:
    interface: dbus
    bus: session
    name: org.kde.kcminit
  dbus-kde-kaccess:
    interface: dbus
    bus: session
