parts:
  scripts:
    plugin: dump
    source: ./scripts
  plasma-desktop-session:
    plugin: nil
    build-packages:
      - git
    override-build: |
      cd $CRAFT_PROJECT_DIR
      craftctl set version="$(date +%Y%m%d)+git$(git rev-parse --short HEAD)"
  sddm-runtime:
    plugin: nil
    after:
      - plasma-desktop-session
    stage-packages:
      - sddm
    override-prime: |
      rm -rf "$CRAFT_PRIME/sddm"
      craftctl default
      mkdir -p "$CRAFT_PRIME/sddm"
      for path in etc usr var; do
        if [ -e "$CRAFT_PRIME/$path" ]; then
          mv "$CRAFT_PRIME/$path" "$CRAFT_PRIME/sddm/$path"
        fi
      done
      qt_lib_dir="$CRAFT_PRIME/sddm/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      find "$qt_lib_dir" -maxdepth 1 \( -type f -o -type l \) \
        -name 'libQt6*.so*' -delete
      rm -rf "$qt_lib_dir/qt6/plugins"
      find "$qt_lib_dir/qt6/qml" -mindepth 1 -maxdepth 1 \
        ! -name SddmComponents -exec rm -rf {} +
      if find "$CRAFT_PRIME/sddm/usr/lib" \
        \( -type f -o -type l \) -name 'libQt6*.so*' -print -quit | grep -q .; then
        echo "The SDDM runtime must use Qt libraries from the KDE content snaps"
        exit 1
      fi
      for path in \
        usr/bin/sddm \
        usr/bin/sddm-greeter-qt6 \
        usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/sddm/sddm-helper \
        usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/sddm/sddm-helper-start-wayland \
        usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/sddm/sddm-helper-start-x11user
      do
        source="$CRAFT_STAGE/sddm-qt6/$path"
        if [[ ! -x "$source" ]]; then
          echo "Qt 6.11 SDDM build is missing $path"
          exit 1
        fi
        install -D -m 0755 "$source" "$CRAFT_PRIME/sddm/$path"
      done
  sddm-qt6-runtime:
    plugin: dump
    source: .sddm-qt6-stage
    after:
      - sddm-runtime
    prime:
      - -sddm-qt6
