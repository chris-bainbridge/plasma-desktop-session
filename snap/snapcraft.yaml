name: plasma-desktop-session
adopt-info: plasma-desktop-session
base: core26-desktop
summary: Plasma Desktop Session for KDE Neon Core
description: |
  Strictly confined Plasma and Ubuntu desktop sessions for KDE Neon Core.

grade: stable
confinement: strict

# All KDE packages staged by the sddm-runtime part (sddm,
# plasma-setup, plasma-keyboard, plasma-nm) must come from a single
# consistent upstream release rather than a mix of Ubuntu's own
# archive and Neon's -- priority: always pins apt to prefer Neon's
# copies even when Ubuntu's archive also ships a same-named package
# (e.g. sddm), so the whole KDE stack here is sourced from one place
# (same suite kf6-core26/plasma-core-desktop already use for KF6/Qt).
package-repositories:
-   type: apt
    components:
    - main
    suites:
    - resolute
    key-id: 444DABCF3667D0283F894EDDE6D4736255751E5D
    # Scheme pinned: gpg reads a bare keyserver.ubuntu.com as hkps, and
    # the hkps endpoint fails against GnuPG 2.4.8 ("Server indicated a
    # failure", 2026-10-14). hkp on :80 still works and is the same URL
    # craft-archives uses as its own fallback keyserver.
    key-server: hkp://keyserver.ubuntu.com:80
    url: http://origin.archive.neon.kde.org/release
    priority: always

environment:
  HOME: $SNAP_REAL_HOME
  XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
  XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
  XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share
  XDG_STATE_HOME: $SNAP_USER_COMMON/.local/state
  XDG_CONFIG_DIRS: :$SNAP/kf6/etc/xdg:$SNAP/plasma/etc/xdg:/etc/xdg
  XDG_DATA_DIRS: :$SNAP/kf6/usr/share:$SNAP/plasma/usr/share:/etc/xdg:/var/lib/snapd/desktop
  XDG_DESKTOP_PORTAL_DIR: /snap/plasma-core26-desktop/current/usr/share/xdg-desktop-portal
  FONTCONFIG_PATH: $SNAP/plasma/etc/fonts
  PATH: $SNAP/plasma/usr/bin:$SNAP/kf6/usr/bin:$SNAP/kf6/usr/bin/qt6:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games
  # Base (/usr, /lib) paths come LAST in LD_LIBRARY_PATH: the
  # core26-desktop base ships its own copies of some libraries that the
  # content snaps also provide (libwayland-server notably, needed by
  # libkwin at a newer version than the base's), and with the base's
  # directories first the loader picks the base's older copies, crashing
  # the session (e.g. "libkwin.so.6: undefined symbol:
  # wl_global_set_withdrawn_listener"). The content snaps are the
  # intended desktop runtime, so they must win.
  LD_LIBRARY_PATH: $SNAP_LIBRARY_PATH:$SNAP/plasma/usr/lib:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/sasl2:$SNAP/kf6/usr/lib:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/usr/lib:/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/lib
  QT_PLUGIN_PATH: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins
  QML2_IMPORT_PATH: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml
  # X11 keymap data lives in the kf6-core26 content snap (mounted at
  # $SNAP/kf6), NOT the plasma-core26 content snap ($SNAP/plasma).
  # XLOCALEDIR must therefore point under $SNAP/kf6: pointing it at
  # $SNAP/plasma/usr/share/X11/locale (which does not exist inside the
  # confined namespace) made libX11/libxkbcommon fail to load any
  # Compose/locale data ("No Compose file for locale C.UTF-8") and was
  # the trigger for the ksmserver SIGSEGV in libxkbcommon.
  XKB_CONFIG_ROOT: $SNAP/kf6/usr/share/X11/xkb
  XLOCALEDIR: $SNAP/kf6/usr/share/X11/locale
  XCURSOR_THEME: breeze_cursors
  XCURSOR_PATH: $SNAP/plasma/usr/share/icons:$SNAP/kf6/usr/share/icons

layout:
  /usr/share/X11/xorg.conf.d:
    symlink: $SNAP/plasma/usr/share/X11/xorg.conf.d
  # NOTE: no layout for /usr/share/X11/xkb: the core26-desktop base
  # ships xkb-data (kept for the host GDM greeter), and a layout
  # symlink cannot replace existing base content ("existing symbolic
  # link in the way" from snap-update-ns). The base's xkeyboard-config
  # is the same resolute data train Neon's is built from, and Qt apps
  # that must see the content snap's copy set XKB_CONFIG_ROOT above
  # anyway. Same reasoning for the mesa/glvnd paths below: the base
  # ships its own egl_vendor.d/gbm/dri for the host greeter, so the
  # session's GL loaders (Neon, via LD_LIBRARY_PATH above) use the
  # base's DRI drivers rather than the content snap's copies.
  /usr/share/libinput:
    symlink: $SNAP/plasma/usr/share/libinput
  /usr/share/pipewire:
    symlink: $SNAP/plasma/usr/share/pipewire
  /usr/bin/xkbcomp:
    symlink: $SNAP/kf6/usr/bin/xkbcomp
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3:
    symlink: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/vdpau:
    symlink: $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/vdpau
  # KAuth's BackendsManager does not honour QT_PLUGIN_PATH: it loads
  # its backend/helper plugins from a hardcoded absolute install
  # path baked in at compile time (KDE_INSTALL_FULL_QTPLUGINDIR),
  # which Neon's packaging computes as /usr/lib/.../qt6/plugins/kf6/
  # kauth. That directory only exists inside the kf6-core26 content
  # snap, so without this layout KAuth always falls back to its
  # no-op DummyBackend (seen as "KAuth was compiled with a working
  # backend, but was unable to load it!"), silently failing every
  # privileged action (e.g. plasma-setup's CreateUser/SetHostname).
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins/kf6/kauth:
    symlink: $SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins/kf6/kauth

apps:
  plasma-desktop-session:
    command: run-session.sh
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - locale-control
      - systemd-user-control
      # startplasma-wayland pushes DISPLAY/WAYLAND_DISPLAY etc. into the
      # session bus activation env + the systemd --user manager env;
      # without this plug both calls are AppArmor-denied and the env only
      # lands later via kwin's UnsetAndSetEnvironment, so units activated
      # before that (ksplash, the polkit agent) inherit a stale env and
      # die on their first attempt.
      - systemd-user-environment

  xdg-desktop-portal-kde:
    command: run-after-portal.sh org.kde.KWinWrapper $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/xdg-desktop-portal-kde
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-freedesktop-impl-portal-kde
    restart-delay: 1s

  plasma-kactivitymanagerd:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/kactivitymanagerd
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-activitymanager
    restart-delay: 1s

  plasma-ksplash:
    # Wait on org.kde.KWin, not org.kde.KWinWrapper: the wrapper claims
    # KWinWrapper before the compositor serves anything, so a wrapper-wait
    # releases ksplash too early (same reasoning as the plasmashell and
    # polkit-agent apps).
    command: run-after.sh org.kde.KWin $SNAP/plasma/usr/bin/ksplashqml
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    daemon: oneshot
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksplash
    restart-condition: never

  plasma-logoutprompt:
    command: run.sh $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/ksmserver-logout-greeter
    environment:
      QT_QPA_PLATFORM: wayland
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-logoutprompt
    restart-condition: never

  plasma-shutdown:
    command: run.sh $SNAP/plasma/usr/bin/plasma-shutdown
    environment:
      QT_QPA_PLATFORM: wayland
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - systemd-user-control
      - wayland-client
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-shutdown
    restart-condition: never

  plasma-ksmserver:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/bin/ksmserver
    environment:
      QT_QPA_PLATFORM: wayland
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - systemd-user-control
      - systemd-user-environment
      - wayland-client
      - x11
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksmserver
    restart-delay: 1s

  plasma-kwin-wayland:
    # KWin creates the session Wayland compositor. Don't let it inherit
    # client display variables from systemd --user, or it chooses a
    # nested Wayland/X11 backend instead of the DRM backend.
    command: run-kwin.sh $SNAP/plasma/usr/bin/kwin_wayland_wrapper --xwayland
    # kwin filters "restricted" Wayland globals (PlasmaWindowManagement,
    # PlasmaWindowActivationFeedback, fake input, screencast, etc.) per
    # client via FilteredDisplay::allowInterface(). To authorise a client
    # kwin looks up its .desktop file's X-KDE-Wayland-Interfaces field by
    # matching service->exec() to the client's executable path via
    # KApplicationTrader. Inside the snap that match can never succeed:
    # the desktop file's Exec=$SNAP/plasma/usr/bin/... contains the literal
    # (unexpanded) $SNAP, so QFileInfo(...).canonicalFilePath() never equals
    # the real /snap/plasma-desktop-session/<rev>/plasma/usr/bin/... path.
    # kwin therefore denies the global and plasmashell logs:
    #   "The PlasmaWindowManagement protocol hasn't activated in time"
    # and the desktop containment never renders. AppArmor profiles already
    # provide the confinement boundary here, so disable kwin's own
    # desktop-file-based interface permission checks.
    environment:
      KWIN_WAYLAND_NO_PERMISSION_CHECKS: "1"
    slots:
      - wayland
      - x11-server
      - desktop
      - screen-inhibit-control
    # kwin_wayland is the Wayland compositor and, on a physical/KMS
    # display, must acquire DRM master. Acquisition goes through
    # systemd-logind's seat/session device handshake: kwin_wayland calls
    # TakeDevice/TakeControl on the session's seat device to get the DRM
    # fd as master (and ReleaseDevice/ReleaseControl to hand it back).
    # Those org.freedesktop.login1.Session/Seat D-Bus methods are only
    # granted by login-session-control (login-session-observe allows only
    # read-only Properties). Without it AppArmor denies the calls and
    # kwin's DRM atomic commit fails EPERM ("Permission denied"), leaving
    # a black screen while systemd-logind retains DRM master.
    plugs:
      - systemd-user-control
      - systemd-user-environment
      - wayland-client
      - opengl
      - login-session-observe
      - login-session-control
      - shutdown
      - system-observe
      # kscreenlocker_worker runs inside this confined app and uses PAM
      # (pam_unix/pam_extrausers) to verify the password when locking and
      # unlocking the screen. PAM execs the setuid/setgid unix_chkpwd and
      # pam_extrausers_chkpwd helpers to do so, since this process can't
      # read /etc/shadow or /var/lib/extrausers/shadow directly. Custom
      # snapd "pam-unix-chkpwd" interface (see build.sh / ubuntu-core-
      # desktop-snapd).
      - pam-unix-chkpwd
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-kwinwrapper
    restart-delay: 1s

  plasma-plasmashell:
    # Wait for the compositor itself (org.kde.KWin, claimed by
    # kwin_wayland once the Wayland server and its globals, including the
    # PlasmaWindowManagement protocol, are initialized) rather than the
    # wrapper (org.kde.KWinWrapper, claimed by kwin_wayland_wrapper before
    # kwin_wayland even starts). Waiting on the wrapper let plasmashell
    # connect to the compositor before the PlasmaWindowManagement protocol
    # was registered, producing "The PlasmaWindowManagement protocol
    # hasn't activated in time" and a broken window-management API.
    # org.kde.KWin is claimed during workspace creation, a few steps
    # before the compositor starts processing Wayland client connections
    # AND before it finishes DRM output enumeration. plasmashell's
    # ScreenPool queries the screen list once at startup and never
    # retries, so if it races ahead of kwin publishing its output the
    # whole desktop stays permanently black (see run-after.sh) -- poll
    # kwin's own readiness instead of guessing a fixed delay.
    command: run-after.sh org.kde.KWin $SNAP/plasma/usr/bin/plasmashell --no-respawn
    environment:
      PLASMA_WAITFORNAME_EXTRA_DELAY: "2"
      PLASMA_WAIT_FOR_KWIN_OUTPUT: "1"
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - mpris
      - wayland-client
      - login-session-observe
      - shutdown
      - system-observe
      # KCMs load in-process into plasmashell (e.g. kcm_clock's Date &
      # Time page); without timezone-control their timedated access is
      # AppArmor-denied, so the page shows nothing and polkit is never
      # consulted (no auth prompt, no change). Grants Properties.Get,
      # ListTimezones and SetTimezone on /org/freedesktop/timedate1;
      # set-timezone is auth_admin_keep, so applying a timezone pops the
      # polkit prompt. NOTE: SetTime/SetNTP are NOT granted by this
      # interface -- the manual-time fields and the NTP toggle still
      # fail (would need a snapd fork interface extension).
      - timezone-control
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-plasmashell
    restart-delay: 1s

  plasma-setup:
    # plasma-setup (staged by the sddm-runtime part below) is otherwise
    # invoked unconfined from the base rootfs, same as its
    # plasma-setup-bootutil/plasma-setup-auth-helper counterparts (see
    # that part's override-prime comment and
    # kde_plasma_setup_integration() in ubuntu-core-desktop/build.sh).
    # That works for bootutil/auth-helper because they never touch
    # Wayland, but the GUI wizard itself is a genuine Wayland client
    # that must render inside the already-running kwin_wayland
    # compositor session -- and kwin's Wayland socket lives under a
    # per-snap private directory
    # (/run/user/<uid>/snap.plasma-desktop-session/wayland-0) that only
    # processes sharing this snap's mount namespace can see. Run
    # unconfined, plasma-setup fails with "Failed to create wl_display
    # (No such file or directory)" no matter how long it waits for a
    # same-named socket to appear elsewhere -- the path genuinely isn't
    # visible outside this namespace. Make it a proper app of this snap
    # instead, sharing the namespace with plasma-kwin-wayland /
    # plasma-plasmashell. Can't just reuse run-after.sh as-is: this is
    # launched via plasma-setup's own XDG autostart .desktop entry, not
    # systemd --user dbus-activation like plasmashell/krunner, so it
    # never receives WAYLAND_DISPLAY via KUpdateLaunchEnvironmentJob --
    # and run-after.sh's own fallback (hardcoded "wayland-0") breaks if
    # kwin has restarted even once this session and picked the next
    # free display name instead (see run-plasma-setup.sh, which does the
    # same org.kde.KWin wait but discovers the real socket name instead
    # of guessing one).
    command: run-plasma-setup.sh $SNAP/sddm/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/plasma-setup
    environment:
      # plasma-setup's own QML modules/KPackages and Qt plugin
      # (qt6/plugins/kf6/packagestructure/plasmasetup.so) live under
      # $SNAP/sddm, not $SNAP/plasma or $SNAP/kf6 -- add them on top of
      # the snap-wide QT_PLUGIN_PATH/QML2_IMPORT_PATH/XDG_DATA_DIRS
      # rather than instead of them.
      QT_PLUGIN_PATH: $SNAP/sddm/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins
      QML2_IMPORT_PATH: $SNAP/sddm/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml:$SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml:$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml
      XDG_DATA_DIRS: $SNAP/sddm/usr/share:$SNAP/plasma/usr/share:$SNAP/kf6/usr/share::/etc/xdg:/var/lib/snapd/desktop
    plugs:
      - wayland-client
      # plasma-setup's CreateUser/SetHostname actions are dispatched via
      # KAuth to the unconfined, D-Bus-activated org.kde.plasmasetup
      # helper (see kde_plasma_setup_integration() in build.sh). Without
      # this, AppArmor denies plasma-setup's confined send of the
      # org.kde.kf6auth/performAction method call outright -- see the
      # custom snapd "kde-kauth" interface (the helper process that
      # actually performs the privileged action runs unconfined, so it
      # needs no plug of its own).
      - kde-kauth

  plasma-krunner:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/bin/krunner --daemon
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - mpris
      - wayland-client
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-krunner

  plasma-kded6:
    command: run-after.sh org.kde.KWinWrapper $SNAP/kf6/usr/bin/kded6
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
      - shutdown
      - system-observe
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-kded6
    restart-delay: 1s

  plasma-ksystemstats:
    command: run.sh $SNAP/plasma/usr/bin/ksystemstats
    slots:
      - wayland
      - x11-server
      - desktop
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-ksystemstats1
    restart-delay: 1s

  plasma-xembedsniproxy:
    command: run-after.sh org.kde.plasmashell $SNAP/plasma/usr/bin/xembedsniproxy
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
      - x11
    after:
      - plasma-kwin-wayland
    daemon: simple
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-xembedsniproxy
    restart-delay: 1s

  plasma-gmenudbusmenuproxy:
    command: run-after.sh org.kde.plasmashell $SNAP/plasma/usr/bin/gmenudbusmenuproxy
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
      - x11
    after:
      - plasma-kwin-wayland
    daemon: simple
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-gmenudbusmenuproxy
    restart-delay: 1s

  plasma-powerdevil:
    command: run-after.sh org.kde.KWinWrapper $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/org_kde_powerdevil
    slots:
      - wayland
      - x11-server
      - desktop
      - screen-inhibit-control
    plugs:
      - wayland-client
      - login-session-observe
      - shutdown
      - system-observe
      - upower-observe
    after:
      - plasma-kwin-wayland
    daemon: dbus
    passthrough:
      daemon-scope: user
      activates-on:
        - dbus-kde-solid-powermanagement
    restart-delay: 1s

  plasma-polkit-agent:
    # Ordering matters: this daemon:simple agent has no D-Bus name to wait
    # on (run-after.sh waits for org.kde.ksmserver, which is claimed before
    # kwin's wrapper exports WAYLAND_DISPLAY/XAUTHORITY). If it starts before
    # kwin_wayland, Qt finds no WAYLAND_DISPLAY, falls back to the xcb platform
    # plugin via DISPLAY=:0, fails xcb auth, and the agent crashes/restart-loops:
    #   "Could not load the Qt platform plugin \"xcb\" ... no Qt platform plugin
    #   could be initialized". Ordering it after kwin (like plasmashell) ensures
    # the Wayland socket and Xauthority file are exported before it starts.
    command: run-after.sh org.kde.KWin $SNAP/plasma/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libexec/polkit-kde-authentication-agent-1
    environment:
      PLASMA_WAITFORNAME_EXTRA_DELAY: "2"
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - polkit-agent
      - wayland-client
    after:
      - plasma-kwin-wayland
    daemon: simple
    passthrough:
      daemon-scope: user
    restart-delay: 1s

  kaccess:
    command: run.sh $SNAP/plasma/usr/bin/kaccess
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    autostart: kaccess.desktop

  xwaylandvideobridge:
    command: run.sh $SNAP/plasma/usr/bin/xwaylandvideobridge
    slots:
      - wayland
      - x11-server
      - desktop
    plugs:
      - wayland-client
    autostart: org.kde.xwaylandvideobridge.desktop


plugs:
  kf6-core26:
    content: kf6-core26
    interface: content
    target: $SNAP/kf6
  plasma-core26:
    content: plasma-core26
    interface: content
    target: $SNAP/plasma
  wayland-client:
    interface: wayland

  audio-playback: null
  audio-record: null
  avahi-control: null
  bluez: null
  bluetooth-control: null
  cups-control: null
  desktop-launch: null
  dot-hidden:
    interface: personal-files
    write:
      - $HOME/.hidden
  hardware-observe: null
  hostname-control: null
